[project]
name = "shipit-api"
version = "0.1.0"
description = "ShipIt notes API (FastAPI + DynamoDB)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "pydantic-settings>=2.6",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[dynamodb]>=5.0",
    "httpx2>=2.16.2",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
