# Local stack: app + DynamoDB Local + Prometheus + Grafana. Start with `make up`.
# Nothing here talks to AWS.

x-dynamodb-local-env: &dynamodb-local-env
  # DynamoDB Local accepts any values. The dummy values below are not credentials.
  # AWS_REGION is "local" on purpose; the real Region lives only in Terraform tfvars.
  AWS_REGION: local
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local # pragma: allowlist secret

services:
  app:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "8000:8000"
    environment:
      <<: *dynamodb-local-env
      TABLE_NAME: shipit-notes
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    # No host port: only the app and dynamodb-init reach it, over the compose network.
    # In-memory, so notes are gone after `make down`.

  # One-shot job that creates the table (Terraform does this in AWS), like a
  # Kubernetes Job / init container.
  dynamodb-init:
    image: amazon/aws-cli:2.42.3
    environment: *dynamodb-local-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ep=http://dynamodb:8000
        until aws dynamodb list-tables --endpoint-url $$ep >/dev/null 2>&1; do sleep 1; done
        aws dynamodb describe-table --endpoint-url $$ep --table-name shipit-notes >/dev/null 2>&1 \
          || aws dynamodb create-table --endpoint-url $$ep --table-name shipit-notes \
               --attribute-definitions AttributeName=id,AttributeType=S \
               --key-schema AttributeName=id,KeyType=HASH \
               --billing-mode PAY_PER_REQUEST >/dev/null
        echo "table shipit-notes ready"
    depends_on:
      - dynamodb

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      # Local only: open dashboards without logging in, read-only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shipit-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
